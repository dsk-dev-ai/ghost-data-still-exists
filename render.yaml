services:
  - type: web
    name: ghost-data-still-exists-demo
    env: python
    plan: free
    buildCommand: pip install -r requirements_demo.txt
    startCommand: uvicorn demo.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DEMO_EXPLAIN_LIMIT
        value: "20"
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PYTHONUNBUFFERED
        value: "1"
